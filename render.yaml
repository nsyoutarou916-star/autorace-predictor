services:
  - type: web
    name: autorace-predictor
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start -- -p $PORT
    envVars:
      - key: DATABASE_URL
        value: file:./prod.db
      - key: NODE_VERSION
        value: 24.19.0
